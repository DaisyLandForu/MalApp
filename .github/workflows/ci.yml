name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check apps malapp integrations training scripts tests
      - run: python -m compileall -q apps malapp integrations training scripts
      - run: python -m pytest
      - name: Regression gate contract
        run: >-
          python -m scripts.evaluation.run_evaluation gate
          tests/fixtures/evaluation/approved-baseline-scorecard.json
          tests/fixtures/evaluation/candidate-scorecard.json
      - run: docker compose config

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: malapp-agent:ci
          build-args: |
            MALAPP_GIT_COMMIT=${{ github.sha }}
      - run: docker run --rm -d --name malapp-ci -p 127.0.0.1:8765:8765 malapp-agent:ci
      - name: Health smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then
              docker stop malapp-ci
              exit 0
            fi
            sleep 1
          done
          docker logs malapp-ci
          exit 1
